{% extends 'tasks/base.html' %}
{% block content %}
    <h2>Task List</h2>
    {% for task in tasks %}
        <p>
            <a href="{% url 'task_detail' task.id %}">{{ forloop.counter }} {{task.title}}</a>
        </p>
    {% empty %}
        <p>No Tasks Available</p>
    {% endfor %}        
{% endblock %}
