<!DOCTYPE html>
<html>
<head>
    <title>Task Detail</title>
</head>
<body>
    <h1>Task Detail</h1>
    <hr>
    <h2>{{ task.title }}</h2>
    <p>
        <strong>Description:</strong>
        {{ task.description}}
    </p>
    <p>
        <strong>Status :</strong>
        {{ task.completed }}
    </p>
    <hr>
    <a href=" {% url 'task_list' %}">Back to Task List</a>
</body>
</html>
